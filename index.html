<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sign up with the dish you're bringing." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1c1613" />
    <title>Thanksgiving menu</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238f2d2a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f6f0e6'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="sheet">
      <header>
        <p class="eyebrow">Family meal</p>
        <h1 id="event-title">Thanksgiving</h1>
        <p class="date" id="event-date">Thursday, November 26, 2026</p>
        <p class="lede" id="event-note">Add what you plan to bring.</p>
      </header>
      <hr class="rules" />
      <p id="banner" class="banner">
        Saving isn't connected yet. Add your Supabase project URL and publishable key in
        <code>config.js</code>.
      </p>
      <div class="layout">
        <form id="dish-form" class="editor" novalidate>
          <h2>Add a dish</h2>
          <div class="field">
            <label for="guest-name">Your name</label>
            <input
              id="guest-name"
              name="guest_name"
              class="control"
              type="text"
              maxlength="80"
              autocomplete="name"
              required
              aria-required="true"
              placeholder="Alex"
            />
          </div>
          <div class="field">
            <label for="dish">You're bringing</label>
            <input
              id="dish"
              name="dish"
              class="control"
              type="text"
              maxlength="120"
              autocomplete="off"
              required
              aria-required="true"
              placeholder="Green bean casserole"
            />
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category" class="control" required aria-required="true">
              <option value="">Choose a category</option>
            </select>
          </div>
          <div class="field">
            <label for="notes">Notes <span class="optional">optional</span></label>
            <textarea
              id="notes"
              name="notes"
              class="control"
              maxlength="280"
              rows="3"
              placeholder="Feeds 8, nut-free, needs the oven"
            ></textarea>
          </div>
          <div class="honeypot" aria-hidden="true">
            <label for="fax-number">Fax number</label>
            <input id="fax-number" name="fax_number" type="text" tabindex="-1" autocomplete="off" />
          </div>
          <button id="submit" class="submit" type="submit">Add to the menu</button>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
        <section id="menu-section" class="menu-section" aria-labelledby="menu-heading">
          <div class="menu-head">
            <h2 id="menu-heading">The menu</h2>
            <button id="refresh" class="refresh" type="button">Refresh</button>
          </div>
          <p id="summary" class="summary" hidden></p>
          <p id="menu-note" class="menu-note" role="status" aria-live="polite"></p>
          <div id="menu"></div>
        </section>
      </div>
    </main>
    <noscript>
      <p class="banner noscript-banner">This page needs JavaScript to load and save dishes.</p>
    </noscript>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
